# Render deployment skeleton (backend + managed Postgres).
# Wire this up when you connect the GitHub repo to Render.
services:
  - type: web
    name: ai-analytics-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        sync: false          # set to your Vercel URL after first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: ai-analytics-db
          property: connectionString
    # Run migrations before the app starts serving.
    preDeployCommand: alembic upgrade head

databases:
  - name: ai-analytics-db
    plan: free
